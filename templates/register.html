{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}<div class="form-container"><div class="card p-4 shadow-sm">
<h2 class="fw-bold mb-1">Create account</h2><p class="text-muted mb-4">Register as a student.</p>
<form method="POST"><div class="mb-3"><label class="form-label">Name</label><input class="form-control" type="text" name="name" required></div>
<div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required></div>
<button class="btn btn-dark w-100">Create Account</button></form>
</div></div>{% endblock %}
