{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}<div class="form-container"><div class="card p-4 shadow-sm">
<h2 class="fw-bold mb-1">Welcome back</h2><p class="text-muted mb-4">Login to your Smart Canteen account.</p>
<form method="POST"><div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
<div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
<button class="btn btn-dark w-100">Login</button></form>
<p class="mt-3 mb-0 text-center">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
</div></div>{% endblock %}
